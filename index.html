<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hogar Edgar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "48e17435-5a5e-42b8-a63d-3a85349aa78b",
      serviceWorkerPath: "/OneSignalSDKWorker.js",
      notifyButton: { enable: false },
      promptOptions: {
        slidedown: {
          prompts: [{
            type: "push",
            autoPrompt: true,
            text: {
              actionMessage: "Activa las notificaciones para saber cuando alguien añade o completa una tarea.",
              acceptButton: "Activar",
              cancelButton: "Ahora no"
            },
            delay: { pageViews: 1, timeDelay: 3 }
          }]
        }
      }
    });
  });
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }
  .container { max-width: 480px; margin: 0 auto; padding: 0 16px 40px; }
  h1 { font-size: 24px; font-weight: 600; padding: 28px 0 4px; }
  .subtitle { font-size: 14px; color: #888; margin-bottom: 24px; }
  .screen { display: none; }
  .screen.active { display: block; }
  .avatar-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .avatar-btn { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 18px 12px; cursor: pointer; text-align: center; transition: all 0.15s; }
  .avatar-btn:hover { border-color: #ccc; background: #fafafa; }
  .avatar-circle { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; margin: 0 auto 10px; }
  .avatar-name { font-size: 15px; font-weight: 500; }
  .avatar-count { font-size: 12px; color: #aaa; margin-top: 6px; }
  .top-bar { display: flex; align-items: center; gap: 10px; padding: 20px 0 16px; }
  .user-pill { display: flex; align-items: center; gap: 6px; margin-left: auto; background: #f0f0ec; padding: 5px 12px 5px 5px; border-radius: 20px; cursor: pointer; }
  .user-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; }
  .tabs { display: flex; border-bottom: 1px solid #e5e5e5; margin-bottom: 20px; }
  .tab { padding: 10px 16px; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; color: #888; background: none; border-top: none; border-left: none; border-right: none; margin-bottom: -1px; }
  .tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 500; }
  .quick-tasks { margin-bottom: 16px; }
  .quick-title { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .quick-btn { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; font-size: 13px; color: #1a1a1a; display: flex; align-items: center; gap: 8px; transition: all 0.12s; }
  .quick-btn:hover { border-color: #ccc; background: #fafafa; }
  .quick-btn.comprar { border-color: #B5D4F4; background: #E6F1FB; color: #0C447C; }
  .quick-icon { font-size: 16px; }
  .custom-form { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  .custom-title { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  .custom-form input, .custom-form select { width: 100%; padding: 9px 12px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 14px; margin-bottom: 8px; background: #fafafa; color: #1a1a1a; }
  .form-row { display: flex; gap: 8px; }
  .form-row select { flex: 1; margin-bottom: 0; }
  .add-btn { padding: 9px 18px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .assign-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .assign-label { font-size: 12px; color: #888; }
  .assign-pill { padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #e5e5e5; background: #fff; color: #888; transition: all 0.12s; }
  .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: flex-end; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; }
  .modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
  .modal input { width: 100%; padding: 10px 14px; border: 1px solid #e5e5e5; border-radius: 10px; font-size: 15px; margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; cursor: pointer; }
  .btn-cancel { background: #f0f0ec; border: none; color: #666; }
  .btn-add { background: #1a1a1a; border: none; color: #fff; font-weight: 500; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .filter-pill { padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #e5e5e5; background: #fff; color: #888; }
  .filter-pill.active { font-weight: 500; border-color: transparent; }
  .section-title { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; margin: 16px 0 8px; }
  .task-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; margin-bottom: 6px; }
  .task-item.done { opacity: 0.45; }
  .task-item.mine { border-left: 3px solid #1a1a1a; }
  .check-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ddd; background: none; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .task-body { flex: 1; min-width: 0; }
  .task-name { font-size: 14px; }
  .task-name.done { text-decoration: line-through; color: #aaa; }
  .task-meta { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .badge-alta { background: #FCEBEB; color: #A32D2D; }
  .badge-recur { background: #EEEDFE; color: #534AB7; }
  .task-del { background: none; border: none; cursor: pointer; color: #ccc; font-size: 18px; padding: 0; flex-shrink: 0; line-height: 1; }
  .task-del:hover { color: #e24b4a; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: #aaa; font-size: 14px; }
  .reminder { background: #FAEEDA; border: 1px solid #EF9F27; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: #633806; display: flex; align-items: center; gap: 8px; }
  .reminder-dot { width: 8px; height: 8px; border-radius: 50%; background: #BA7517; flex-shrink: 0; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .history-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
  .history-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .history-text { flex: 1; font-size: 13px; }
  .history-time { font-size: 11px; color: #aaa; white-space: nowrap; }
  .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px; }
  .stat-card { background: #f0f0ec; border-radius: 10px; padding: 14px; }
  .stat-label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .stat-value { font-size: 24px; font-weight: 600; }
  .bar-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
  .bar-wrap { flex: 1; height: 5px; background: #f0f0ec; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .loading { text-align: center; padding: 2rem; color: #aaa; font-size: 14px; }
  .sync-indicator { font-size: 11px; color: #aaa; text-align: right; margin-bottom: 8px; }
  .sync-indicator.syncing { color: #BA7517; }
  .sync-indicator.ok { color: #0F6E56; }
</style>
</head>
<body>
<div class="container">

<div id="screenHome" class="screen active">
  <h1>Hola, ¿quién eres?</h1>
  <p class="subtitle">Selecciona tu perfil para gestionar las tareas del hogar.</p>
  <div class="avatar-grid" id="avatarGrid"><div class="loading">Cargando...</div></div>
</div>

<div id="screenMain" class="screen">
  <div class="top-bar">
    <div style="font-size:20px;font-weight:600">Hogar Edgar</div>
    <div class="user-pill" onclick="changeUser()">
      <div class="user-dot" id="userDot"></div>
      <span style="font-size:13px;font-weight:500" id="userName"></span>
    </div>
  </div>

  <div id="reminderBanner" class="reminder" style="display:none">
    <div class="reminder-dot"></div>
    <span id="reminderText"></span>
  </div>

  <div class="sync-indicator" id="syncIndicator">Sincronizado</div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('tareas',this)">Tareas</button>
    <button class="tab" onclick="switchTab('historial',this)">Historial</button>
    <button class="tab" onclick="switchTab('estadisticas',this)">Estadísticas</button>
  </div>

  <div id="tab-tareas">
    <div class="quick-tasks">
      <div class="quick-title">Añadir tarea rápida</div>
      <div class="assign-row">
        <span class="assign-label">Para:</span>
        <span class="assign-pill active" id="apill-0" onclick="setAssign(0)">Todos</span>
        <span class="assign-pill" id="apill-1" onclick="setAssign(1)">Edgar</span>
        <span class="assign-pill" id="apill-2" onclick="setAssign(2)">Eva</span>
        <span class="assign-pill" id="apill-3" onclick="setAssign(3)">Martina</span>
        <span class="assign-pill" id="apill-4" onclick="setAssign(4)">Mojito</span>
        <span class="assign-pill" id="apill-5" onclick="setAssign(5)">Alex</span>
      </div>
      <div class="quick-grid" id="quickGrid"></div>
    </div>
    <div class="custom-form">
      <div class="custom-title">Otra tarea</div>
      <input type="text" id="newTaskName" placeholder="Escribe la tarea..." onkeydown="if(event.key==='Enter')addCustomTask()">
      <div class="form-row">
        <select id="newTaskPrio"><option value="normal">Normal</option><option value="alta">Urgente</option></select>
        <select id="newTaskRecur"><option value="">Sin repetición</option><option value="diaria">Diaria</option><option value="semanal">Semanal</option></select>
        <button class="add-btn" onclick="addCustomTask()">+</button>
      </div>
    </div>
    <div class="filters" id="catFilters"></div>
    <div id="taskList"><div class="loading">Cargando tareas...</div></div>
  </div>

  <div id="tab-historial" style="display:none"><div id="historyList"><div class="loading">Cargando...</div></div></div>
  <div id="tab-estadisticas" style="display:none">
    <div class="stats-grid" id="statsCards"></div>
    <div class="section-title">Por miembro</div>
    <div id="memberStats"></div>
  </div>
</div>

</div>

<div class="modal-bg" id="compraModal">
  <div class="modal">
    <h3>¿Qué hay que comprar?</h3>
    <input type="text" id="compraInput" placeholder="ej. Leche, pan, zumo..." onkeydown="if(event.key==='Enter')addCompra()">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-add" onclick="addCompra()">Añadir</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://dyxqumifxsvrxorenpxl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zQlpWBa7BoMSKr7R_h3CHw_Z4v4F6RM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const OS_APP_ID = '48e17435-5a5e-42b8-a63d-3a85349aa78b';

const MEMBERS = [
  {id:1,name:'Edgar',colorBg:'#E6F1FB',color:'#185FA5'},
  {id:2,name:'Eva',colorBg:'#FBEAF0',color:'#993556'},
  {id:3,name:'Martina',colorBg:'#E1F5EE',color:'#0F6E56'},
  {id:4,name:'Mojito',colorBg:'#EEEDFE',color:'#534AB7'},
  {id:5,name:'Alex',colorBg:'#FAEEDA',color:'#854F0B'}
];

const QUICK_TASKS = [
  {name:'Tender ropa',cat:'limpieza',icon:'👕'},
  {name:'Poner lavadora',cat:'limpieza',icon:'🫧'},
  {name:'Poner secadora',cat:'limpieza',icon:'🌀'},
  {name:'Poner lavavajillas',cat:'cocina',icon:'🍽️'},
  {name:'Vaciar lavavajillas',cat:'cocina',icon:'✨'},
  {name:'Sacar basura',cat:'otros',icon:'🗑️'},
  {name:'Pasar aspirador',cat:'limpieza',icon:'🧹'},
  {name:'Fregar suelo',cat:'limpieza',icon:'🪣'},
  {name:'Hacer cama',cat:'otros',icon:'🛏️'},
  {name:'Limpiar baño',cat:'limpieza',icon:'🚿'},
  {name:'Comprar...',cat:'compras',icon:'🛒',special:'compra'},
];

const CAT = {
  cocina:{label:'Cocina',bg:'#FAEEDA',color:'#633806'},
  limpieza:{label:'Limpieza',bg:'#E1F5EE',color:'#085041'},
  compras:{label:'Compras',bg:'#E6F1FB',color:'#0C447C'},
  otros:{label:'Otros',bg:'#EEEDFE',color:'#3C3489'}
};

let currentMember=null, tasks=[], history=[], activeFilter='todas', selectedAssign=0, channel=null;

function getMember(id){ return MEMBERS.find(m=>m.id===id); }
function initials(name){ return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function timeAgo(ts){
  const d=Date.now()-new Date(ts).getTime();
  if(d<60000)return 'ahora';
  if(d<3600000)return Math.round(d/60000)+'m';
  if(d<86400000)return Math.round(d/3600000)+'h';
  return Math.round(d/86400000)+'d';
}

function setSyncStatus(s){
  const el=document.getElementById('syncIndicator');
  if(s==='syncing'){el.textContent='Sincronizando...';el.className='sync-indicator syncing';}
  else if(s==='ok'){el.textContent='Sincronizado';el.className='sync-indicator ok';setTimeout(()=>{el.className='sync-indicator';},2000);}
}

async function sendNotification(title, message, excludeMemberId){
  try {
    const filters = excludeMemberId ? [
      {"field":"tag","key":"member_id","relation":"!=","value":String(excludeMemberId)}
    ] : [];
    await fetch('https://onesignal.com/api/v1/notifications', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        app_id: OS_APP_ID,
        headings: {es: title},
        contents: {es: message},
        filters: filters.length ? filters : undefined,
        included_segments: filters.length ? undefined : ['All']
      })
    });
  } catch(e){}
}

function setAssign(id){
  selectedAssign=id;
  for(let i=0;i<=5;i++){
    const el=document.getElementById('apill-'+i);
    if(!el)continue;
    el.classList.remove('active');
    el.style.background='';el.style.color='';el.style.borderColor='';
  }
  const el=document.getElementById('apill-'+id);
  el.classList.add('active');
  if(id>0){const m=getMember(id);el.style.background=m.colorBg;el.style.color=m.color;el.style.borderColor='transparent';}
  else{el.style.background='#e5e5e5';el.style.color='#555';el.style.borderColor='transparent';}
}

function renderQuickGrid(){
  document.getElementById('quickGrid').innerHTML=QUICK_TASKS.map(t=>{
    const isCompra=t.special==='compra';
    return `<button class="quick-btn${isCompra?' comprar':''}" onclick="${isCompra?'openCompraModal()':'quickAdd(\''+t.name+'\',\''+t.cat+'\')'}">
      <span class="quick-icon">${t.icon}</span>${t.name}</button>`;
  }).join('');
}

function openCompraModal(){ document.getElementById('compraModal').classList.add('open'); setTimeout(()=>document.getElementById('compraInput').focus(),100); }
function closeModal(){ document.getElementById('compraModal').classList.remove('open'); document.getElementById('compraInput').value=''; }

async function addCompra(){
  const what=document.getElementById('compraInput').value.trim();
  if(!what)return;
  closeModal();
  await addTaskToDB('Comprar: '+what,'compras','normal','');
}

async function quickAdd(name,cat){ await addTaskToDB(name,cat,'normal',''); }

async function addCustomTask(){
  const name=document.getElementById('newTaskName').value.trim();
  if(!name)return;
  const prio=document.getElementById('newTaskPrio').value;
  const recur=document.getElementById('newTaskRecur').value;
  await addTaskToDB(name,'otros',prio,recur);
  document.getElementById('newTaskName').value='';
}

async function addTaskToDB(name,cat,prio,recur){
  setSyncStatus('syncing');
  const {error}=await sb.from('tasks').insert({name,cat,prio,recur,done:false,added_by:currentMember,assigned_to:selectedAssign});
  if(!error){
    setSyncStatus('ok');
    const m=getMember(currentMember);
    const assignedM=selectedAssign>0?getMember(selectedAssign):null;
    const msg=assignedM?`Para ${assignedM.name}: ${name}`:`Nueva tarea: ${name}`;
    await sendNotification(`${m.name} añadió una tarea`, msg, currentMember);
    await loadTasks();
  }
}

async function loadTasks(){
  const {data,error}=await sb.from('tasks').select('*').order('created_at',{ascending:false});
  if(!error)tasks=data||[];
  renderTasks(); checkReminders();
}

async function loadHistory(){
  const {data,error}=await sb.from('history').select('*').order('done_at',{ascending:false}).limit(50);
  if(!error)history=data||[];
  renderHistory();
}

async function completeTask(id){
  const t=tasks.find(t=>t.id===id);
  if(!t)return;
  setSyncStatus('syncing');
  const now=new Date().toISOString();
  await sb.from('tasks').update({done:true,done_by:currentMember,done_at:now}).eq('id',id);
  await sb.from('history').insert({task_name:t.name,member_id:currentMember,cat:t.cat,done_at:now});
  const m=getMember(currentMember);
  await sendNotification(`${m.name} completó una tarea`, `✓ ${t.name}`, currentMember);
  setSyncStatus('ok');
  await loadTasks();
}

async function uncompleteTask(id){
  const t=tasks.find(t=>t.id===id);
  if(!t)return;
  setSyncStatus('syncing');
  await sb.from('tasks').update({done:false,done_by:null,done_at:null}).eq('id',id);
  await sb.from('history').delete().eq('task_name',t.name).eq('member_id',t.done_by);
  setSyncStatus('ok');
  await loadTasks();
}

async function deleteTask(id){
  setSyncStatus('syncing');
  await sb.from('tasks').delete().eq('id',id);
  setSyncStatus('ok');
  await loadTasks();
}

function subscribeRealtime(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('tasks-ch').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>{loadTasks();}).subscribe();
}

async function renderHome(){
  await loadTasks();
  const grid=document.getElementById('avatarGrid');
  grid.innerHTML='';
  MEMBERS.forEach(m=>{
    const done=tasks.filter(t=>t.done&&t.done_by===m.id).length;
    const btn=document.createElement('div');
    btn.className='avatar-btn';
    btn.innerHTML=`<div class="avatar-circle" style="background:${m.colorBg};color:${m.color}">${initials(m.name)}</div>
      <div class="avatar-name">${m.name}</div><div class="avatar-count">${done} completadas</div>`;
    btn.onclick=()=>enterAs(m.id);
    grid.appendChild(btn);
  });
}

function enterAs(id,skipSave){
  currentMember=id;
  if(!skipSave)localStorage.setItem('hogar_member',id);
  const m=getMember(id);
  const dot=document.getElementById('userDot');
  dot.style.background=m.colorBg;dot.style.color=m.color;dot.textContent=initials(m.name);
  document.getElementById('userName').textContent=m.name;
  document.getElementById('screenHome').classList.remove('active');
  document.getElementById('screenMain').classList.add('active');
  OneSignalDeferred.push(async function(OneSignal){
    await OneSignal.login('member_'+id);
    await OneSignal.User.addTag('member_id', String(id));
  });
  renderQuickGrid(); setAssign(0); subscribeRealtime();
  switchTab('tareas',document.querySelector('.tab'));
}

function changeUser(){
  localStorage.removeItem('hogar_member');
  if(channel){sb.removeChannel(channel);channel=null;}
  currentMember=null;
  document.getElementById('screenMain').classList.remove('active');
  document.getElementById('screenHome').classList.add('active');
  renderHome();
}

function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  ['tareas','historial','estadisticas'].forEach(t=>{document.getElementById('tab-'+t).style.display=t===name?'block':'none';});
  if(name==='tareas')loadTasks();
  if(name==='historial')loadHistory();
  if(name==='estadisticas')loadStats();
}

function checkReminders(){
  const alta=tasks.filter(t=>!t.done&&t.prio==='alta');
  const myTasks=tasks.filter(t=>!t.done&&t.assigned_to===currentMember);
  const banner=document.getElementById('reminderBanner');
  if(alta.length>0){document.getElementById('reminderText').textContent=`${alta.length} tarea${alta.length>1?'s':''} urgente${alta.length>1?'s':''}: "${alta[0].name}"`;banner.style.display='flex';}
  else if(myTasks.length>0){document.getElementById('reminderText').textContent=`Tienes ${myTasks.length} tarea${myTasks.length>1?'s':''} asignada${myTasks.length>1?'s':''} a ti.`;banner.style.display='flex';}
  else banner.style.display='none';
}

function setFilter(cat){activeFilter=cat;renderTasks();}

function renderFilters(){
  const cats=['todas','cocina','limpieza','compras','otros'];
  document.getElementById('catFilters').innerHTML=cats.map(c=>{
    const active=activeFilter===c;
    const meta=c==='todas'?{label:'Todas',bg:'#e5e5e5',color:'#555'}:CAT[c];
    return `<span class="filter-pill${active?' active':''}" style="${active?'background:'+meta.bg+';color:'+meta.color:''}" onclick="setFilter('${c}')">${meta.label}</span>`;
  }).join('');
}

function renderTasks(){
  renderFilters();
  const f=activeFilter;
  const filtered=tasks.filter(t=>f==='todas'||t.cat===f);
  const myFiltered=filtered.filter(t=>!t.done&&(t.assigned_to===0||t.assigned_to===null||t.assigned_to===currentMember));
  const othersFiltered=filtered.filter(t=>!t.done&&t.assigned_to!==0&&t.assigned_to!==null&&t.assigned_to!==currentMember);
  const done=filtered.filter(t=>t.done);

  function taskHTML(t,ismine){
    const doer=t.done_by?getMember(t.done_by):null;
    const cat=CAT[t.cat]||CAT.otros;
    const recurLabel={diaria:'Diaria',semanal:'Semanal'};
    const checkStyle=t.done&&doer?`background:${doer.colorBg};border-color:${doer.color}`:'';
    const checkContent=t.done&&doer?`<svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 5L4 7.5L8.5 2.5" stroke="${doer.color}" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>`:'';
    const assignedTo=t.assigned_to&&t.assigned_to!==0?getMember(t.assigned_to):null;
    return `<div class="task-item${t.done?' done':''}${ismine?' mine':''}">
      <button class="check-btn" style="${checkStyle}" onclick="${t.done?'uncompleteTask':'completeTask'}(${t.id})">${checkContent}</button>
      <div class="task-body">
        <div class="task-name${t.done?' done':''}">${t.name}</div>
        <div class="task-meta">
          <span class="badge" style="background:${cat.bg};color:${cat.color}">${cat.label}</span>
          ${t.prio==='alta'?'<span class="badge badge-alta">Urgente</span>':''}
          ${t.recur?`<span class="badge badge-recur">${recurLabel[t.recur]||t.recur}</span>`:''}
          ${assignedTo?`<span class="badge" style="background:${assignedTo.colorBg};color:${assignedTo.color}">Para ${assignedTo.name}</span>`:'<span class="badge" style="background:#f0f0ec;color:#555">Para todos</span>'}
          ${t.done&&doer?`<span style="font-size:11px;color:#aaa">Hecho por ${doer.name} · ${timeAgo(t.done_at)}</span>`:''}
        </div>
      </div>
      ${!t.done?`<button class="task-del" onclick="deleteTask(${t.id})">×</button>`:''}
    </div>`;
  }

  let html='';
  if(myFiltered.length){html+=`<div class="section-title">Para mí / todos (${myFiltered.length})</div>`;myFiltered.forEach(t=>{html+=taskHTML(t,true);});}
  if(othersFiltered.length){html+=`<div class="section-title">Para otros (${othersFiltered.length})</div>`;othersFiltered.forEach(t=>{html+=taskHTML(t,false);});}
  if(done.length){html+=`<div class="section-title" style="margin-top:1rem">Completadas (${done.length})</div>`;done.forEach(t=>{html+=taskHTML(t,false);});}
  if(!myFiltered.length&&!othersFiltered.length&&!done.length)html='<div class="empty-state">No hay tareas. Añade una arriba.</div>';
  document.getElementById('taskList').innerHTML=html;
}

function renderHistory(){
  if(!history.length){document.getElementById('historyList').innerHTML='<div class="empty-state">Todavía no hay historial.</div>';return;}
  document.getElementById('historyList').innerHTML=history.map(h=>{
    const m=getMember(h.member_id);
    const cat=CAT[h.cat]||CAT.otros;
    return `<div class="history-item">
      <div class="history-dot" style="background:${m?m.color:'#aaa'}"></div>
      <div class="history-text"><strong>${m?m.name:'?'}</strong> completó "${h.task_name}"</div>
      <div class="history-time">${timeAgo(h.done_at)}</div>
    </div>`;
  }).join('');
}

async function loadStats(){await loadHistory();renderStats();}

function renderStats(){
  const total=tasks.length,done=tasks.filter(t=>t.done).length;
  document.getElementById('statsCards').innerHTML=`
    <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Completadas</div><div class="stat-value" style="color:#0F6E56">${done}</div></div>
    <div class="stat-card"><div class="stat-label">Pendientes</div><div class="stat-value">${total-done}</div></div>`;
  const mCount={};
  MEMBERS.forEach(m=>mCount[m.id]=history.filter(h=>h.member_id===m.id).length);
  const maxM=Math.max(...Object.values(mCount),1);
  document.getElementById('memberStats').innerHTML=MEMBERS.map(m=>{
    const pct=Math.round((mCount[m.id]/maxM)*100);
    return `<div class="bar-row">
      <div style="width:26px;height:26px;border-radius:50%;background:${m.colorBg};color:${m.color};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0">${initials(m.name)}</div>
      <span style="font-size:13px;min-width:55px">${m.name}</span>
      <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${m.color}"></div></div>
      <span style="font-size:12px;color:#aaa;min-width:20px;text-align:right">${mCount[m.id]}</span>
    </div>`;
  }).join('');
}

const saved=localStorage.getItem('hogar_member');
if(saved){const id=parseInt(saved);if(MEMBERS.find(m=>m.id===id)){renderHome().then(()=>{enterAs(id,true);});}else{renderHome();}}
else{renderHome();}
</script>
